name: Update Coding Statistics

on:
  schedule:
    # Runs twice a day at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Fetch Latest LeetCode Statistics
        run: node .github/scripts/fetch-leetcode.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet src/data/coding-stats.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & Push Changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/coding-stats.json
          git commit -m "chore: auto-update coding statistics"
          git push

      - name: Install & Build
        if: steps.git-check.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages branch
        if: steps.git-check.outputs.changed == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages

