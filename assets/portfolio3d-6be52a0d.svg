<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="15" y="15" width="170" height="170" rx="36" fill="#0F172A"/>
  <!-- 3D Isometric Cube -->
  <!-- Top Face -->
  <polygon points="100,45 150,72 100,99 50,72" fill="url(#topFace)"/>
  <!-- Left Face -->
  <polygon points="50,72 100,99 100,155 50,128" fill="url(#leftFace)"/>
  <!-- Right Face -->
  <polygon points="100,99 150,72 150,128 100,155" fill="url(#rightFace)"/>
  <!-- Glowing Wireframe Accents -->
  <polyline points="50,72 100,45 150,72 150,128 100,155 50,128 50,72" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <line x1="100" y1="99" x2="100" y2="155" stroke="#93C5FD" stroke-width="4"/>
  <line x1="100" y1="99" x2="150" y2="72" stroke="#93C5FD" stroke-width="4"/>
  <line x1="100" y1="99" x2="50" y2="72" stroke="#93C5FD" stroke-width="4"/>
  <!-- Orbital React / 3D ring -->
  <ellipse cx="100" cy="100" rx="75" ry="30" fill="none" stroke="#00F2FE" stroke-width="3" transform="rotate(-25 100 100)" stroke-dasharray="8 6"/>
</svg>
